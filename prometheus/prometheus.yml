global:
  scrape_interval: 2s # default:1min, collecting frequency set to 2s for learning purposes
  scrape_timeout: 2s # default:10sec, maximum timeout when no response

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['gateway-service:9099']

  - job_name: 'course-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['course-service:9091']

  - job_name: 'enrollment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['enrollment-service:9092']

  - job_name: 'feedback-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['feedback-service:9093']

  - job_name: 'aggregate-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['aggregate-service:9094']

  - job_name: 'dispatcher-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'dispatcher-service:9096']